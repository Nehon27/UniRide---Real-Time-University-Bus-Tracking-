<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniRide — Live Bus Tracker</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div id="topbar">
      <h1>🚌 UniRide — Live Bus Tracker</h1>
      <span id="status-badge" class="live">Live</span>
    </div>

    <div id="map"></div>
    <div id="empty-msg">No buses are currently active.</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Default view: Dhaka, Bangladesh
      const map = L.map("map").setView([23.8103, 90.4125], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19,
      }).addTo(map);
    </script>
  </body>
</html>
