<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniRide — Live Bus Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; }

    #topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 56px;
        background: #1a3c6e;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 1000;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #topbar h1 { font-size: 18px; font-weight: 600; }
    #status-badge {
        font-size: 13px;
        background: rgba(255,255,255,0.15);
        padding: 5px 12px;
        border-radius: 14px;
    }
    #status-badge.live::before {
        content: "●";
        color: #4caf50;
        margin-right: 6px;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    #map { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; }

    #empty-msg {
        position: fixed;
        top: 80px; left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 10px 18px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-size: 14px;
        color: #444;
        z-index: 999;
        display: none;
    }

    .bus-popup { font-size: 14px; line-height: 1.5; }
    .bus-popup b { color: #1a3c6e; }

    .bus-icon {
        background: #1a3c6e;
        color: white;
        border-radius: 50%;
        width: 34px; height: 34px;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px;
        border: 3px solid white;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
</style>
</head>

    <h1>🚌 UniRide — Live Bus Tracker</h1>
    <span id="status-badge" class="live">Live</span>
</div>
